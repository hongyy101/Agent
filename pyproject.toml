[project]
name = "agent-platform"
version = "0.1.0"
description = "Product-grade AI Agent platform: LangGraph + MCP + Postgres + DeepSeek"
requires-python = ">=3.11"
dependencies = [
    # ---- 第1月：LangGraph 运行时 + Postgres 持久化 ----
    "langgraph>=0.6.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-openai>=0.3.0",
    "psycopg[pool]>=3.2.0",
    "pydantic-settings>=2.6.0",

    # ---- 第2月：MCP 工具层 + 权限中间件 ----
    # "mcp>=1.0.0",
    # "langchain-mcp-adapters>=0.1.0",
    # "fastapi>=0.115.0",
    # "uvicorn[standard]>=0.32.0",
    # "httpx>=0.28.0",

    # ---- 第3月：HITL + 容错 ----
    # "jinja2>=3.1.0",

    # ---- 第4月：可观测性 ----
    # "langfuse>=2.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]